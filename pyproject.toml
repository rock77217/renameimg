[project]
name = "renameimg"
version = "2.0.0"
description = "依拍攝日期重新命名照片與影片，並將影片壓縮為 HEVC"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
renameimg = "renameimg.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
